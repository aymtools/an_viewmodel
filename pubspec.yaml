name: an_viewmodel
description: "A package for managing ViewModel that depends on anlifecycle. Similar to Androidx ViewModel."
version: 3.8.0
homepage: https://github.com/aymtools/an_viewmodel/
issue_tracker: https://github.com/aymtools/an_viewmodel/issues

topics:
  - viewmodel
  - view-model
  - viewmodels
  - mvvm

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  cancellable: ^2.6.0
  weak_collections: ^1.6.1
  anlifecycle: ^3.7.0
  an_lifecycle_cancellable: ^2.6.0
  an_async_data: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.5.1
  flutter_lints: any

